<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="PIMS">
  <!-- 파비콘 — 앱 로고(말풍선+PIMS)를 소형에서 읽히도록 "말풍선+P"로 단순화.
       색·형태(하늘색 테두리 말풍선, 주황 그라디언트 꼬리·P)는 헤더 로고와 동일 계열. -->
  <defs>
    <linearGradient id="favSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fb7f0"/><stop offset="1" stop-color="#3d93de"/>
    </linearGradient>
    <linearGradient id="favTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffce5c"/><stop offset="1" stop-color="#f39b1e"/>
    </linearGradient>
    <linearGradient id="favP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc62b"/><stop offset="1" stop-color="#f5a50d"/>
    </linearGradient>
  </defs>
  <rect x="24" y="48" width="352" height="252" rx="88" fill="#ffffff" stroke="url(#favSky)" stroke-width="26"/>
  <path d="M112 286 L74 372 Q68 386 84 377 L162 322 Q170 317 163 311 L124 283 Q116 277 112 286 Z" fill="url(#favTail)"/>
  <text x="200" y="248" text-anchor="middle"
        font-family="'Pretendard','Segoe UI',Arial,sans-serif" font-weight="800"
        font-size="200" fill="url(#favP)">P</text>
</svg>
